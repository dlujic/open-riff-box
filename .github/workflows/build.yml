name: Build

on:
  push:
    branches: [ main, xplat-port ]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: ${{ matrix.os }} ${{ matrix.flavor }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        # ubuntu-22.04 pinned (not -latest): building against the older glibc keeps
        # the linux binaries runnable on 22.04-era distros; newer systems are
        # backward compatible.
        os: [ windows-latest, macos-latest, ubuntu-22.04 ]
        # tools = ORB_OFFLINE_TOOLS render build. mac/linux tools artifacts feed the
        # offline validation kit; the windows one is built for compile coverage only
        # (local build-offline covers rendering there), hence no windows-tools upload.
        flavor: [ ship, tools ]

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libjack-jackd2-dev libx11-dev \
            libxrandr-dev libxinerama-dev libxcursor-dev libfreetype-dev \
            libfontconfig1-dev

      - name: Configure (Windows)
        if: runner.os == 'Windows'
        run: cmake -B build -A x64 -DORB_OFFLINE_TOOLS=${{ matrix.flavor == 'tools' && 'ON' || 'OFF' }}

      - name: Configure (macOS)
        if: runner.os == 'macOS'
        run: >
          cmake -B build -DCMAKE_BUILD_TYPE=Release
          "-DCMAKE_OSX_ARCHITECTURES=x86_64;arm64"
          -DCMAKE_OSX_DEPLOYMENT_TARGET=10.13
          -DORB_OFFLINE_TOOLS=${{ matrix.flavor == 'tools' && 'ON' || 'OFF' }}

      - name: Configure (Linux)
        if: runner.os == 'Linux'
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release -DORB_OFFLINE_TOOLS=${{ matrix.flavor == 'tools' && 'ON' || 'OFF' }}

      - name: Build
        run: cmake --build build --config Release --parallel 4

      - name: Package (Windows)
        if: runner.os == 'Windows' && matrix.flavor == 'ship'
        shell: pwsh
        # VST3 rides next to the portable folder, same layout as the mac/linux tars
        run: Compress-Archive -Path build/dist/OpenRiffBox, build/OpenRiffBox_artefacts/Release/VST3/OpenRiffBox.vst3 -DestinationPath OpenRiffBox-windows-x64.zip

      - name: Package (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          # upload-artifact zips strip unix exec bits and symlinks, so tar first
          mkdir stage
          cp -R build/OpenRiffBox_artefacts/Release/Standalone/OpenRiffBox.app stage/
          cp -R build/OpenRiffBox_artefacts/Release/VST3/OpenRiffBox.vst3 stage/
          # ad-hoc seal the (unsigned-beta) app so quarantined downloads get the
          # recoverable "unidentified developer" flow instead of "damaged"
          codesign --force -s - stage/OpenRiffBox.app
          tar -czf "OpenRiffBox-macos${{ matrix.flavor == 'tools' && '-tools' || '' }}.tar.gz" \
            -C stage OpenRiffBox.app OpenRiffBox.vst3

      - name: Package (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          # upload-artifact zips strip unix exec bits and symlinks, so tar first
          mkdir stage
          cp -r build/dist/OpenRiffBox stage/
          cp -r build/OpenRiffBox_artefacts/Release/VST3/OpenRiffBox.vst3 stage/
          tar -czf "OpenRiffBox-linux-x64${{ matrix.flavor == 'tools' && '-tools' || '' }}.tar.gz" \
            -C stage OpenRiffBox OpenRiffBox.vst3

      - name: Upload (Windows)
        if: runner.os == 'Windows' && matrix.flavor == 'ship'
        uses: actions/upload-artifact@v4
        with:
          name: OpenRiffBox-windows-x64
          path: OpenRiffBox-windows-x64.zip
          if-no-files-found: error

      - name: Upload (macOS / Linux)
        if: runner.os != 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: OpenRiffBox-${{ runner.os == 'macOS' && 'macos' || 'linux-x64' }}${{ matrix.flavor == 'tools' && '-tools' || '' }}
          path: OpenRiffBox-*.tar.gz
          if-no-files-found: error
